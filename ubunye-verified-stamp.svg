<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Ubunye Fitness Youth Program NPC verified stamp" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <path id="top" d="M 50,200 A 150,150 0 1,1 350,200"/>
    <path id="bot" d="M 42,200 A 158,158 0 0,0 358,200"/>
    <polygon id="st" points="0,-9 2.6,-3 9,-2.8 4,1.6 5.6,8 0,4.4 -5.6,8 -4,1.6 -9,-2.8 -2.6,-3"/>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#16244f">
    <!-- rings -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="#16244f" stroke-width="7"/>
    <circle cx="200" cy="200" r="180" fill="none" stroke="#4b4a9e" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="124" fill="none" stroke="#16244f" stroke-width="3"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="#4b4a9e" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- ring text -->
    <text font-size="24" font-weight="700" text-anchor="middle">
      <textPath href="#top" startOffset="50%" textLength="400" lengthAdjust="spacing">UBUNYE FITNESS YOUTH PROGRAM</textPath>
    </text>
    <text font-size="19" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#4b4a9e">
      <textPath href="#bot" startOffset="50%">AUTHENTICITY CONFIRMED</textPath>
    </text>
    <!-- separators -->
    <use href="#st" x="40" y="200" transform="translate(0,0)" fill="#4b4a9e"/>
    <use href="#st" x="360" y="200" fill="#4b4a9e"/>
    <!-- check badge -->
    <circle cx="200" cy="146" r="34" fill="#16244f"/>
    <circle cx="200" cy="146" r="28" fill="none" stroke="#c9b8f2" stroke-width="2"/>
    <path d="M184 147 L196 159 L218 134" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- band -->
    <rect x="66" y="192" width="268" height="50" rx="4" fill="#16244f"/>
    <rect x="71" y="197" width="258" height="40" rx="2" fill="none" stroke="#c9b8f2" stroke-width="1.5"/>
    <text x="200" y="227" font-size="34" font-weight="800" letter-spacing="6" text-anchor="middle" fill="#fff">VERIFIED</text>
    <!-- date and initials -->
    <line x1="108" y1="276" x2="187" y2="276" stroke="#16244f" stroke-width="1.5"/>
    <line x1="213" y1="276" x2="292" y2="276" stroke="#16244f" stroke-width="1.5"/>
    <text x="147.500" y="289" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">DATE</text>
    <text x="252.500" y="289" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">INITIALS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
